name: .NET API CI

on:
  push:
    branches:
      - feature/wil-brian-request-validation
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore PATH_TO_YOUR_CSPROJ

      - name: Build API
        run: dotnet build PATH_TO_YOUR_CSPROJ --configuration Release --no-restore
