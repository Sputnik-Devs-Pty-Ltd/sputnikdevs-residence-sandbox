name: Polyglot WIL Sandbox CI (.NET 10, Angular, Flutter, SQL, Data & AI)

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'docs/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET API and test dependencies
        run: dotnet restore SputnikResidence.Tests/SputnikResidence.Tests.csproj

      - name: Build .NET 10 API (Release)
        run: dotnet build SputnikDevs.Residence.SandboxApi/SputnikDevs.Residence.SandboxApi.csproj --configuration Release --no-restore

      - name: Run xUnit Unit Tests
        run: dotnet test SputnikResidence.Tests/SputnikResidence.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Run Automated API Runtime & Endpoint Smoke Test
        run: |
          dotnet run --project SputnikDevs.Residence.SandboxApi/SputnikDevs.Residence.SandboxApi.csproj --configuration Release --no-build --urls "http://127.0.0.1:5035" &
          API_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5035/api/v1/rooms > /dev/null; then
              echo "✅ Sandbox API started on http://127.0.0.1:5035"
              break
            fi
            sleep 1
          done
          echo "=== GET /api/v1/rooms ==="
          curl -sf http://127.0.0.1:5035/api/v1/rooms | head -c 500
          echo ""
          echo "=== GET /api/v1/students ==="
          curl -sf http://127.0.0.1:5035/api/v1/students | head -c 500
          echo ""
          echo "=== GET /api/v1/tickets ==="
          curl -sf http://127.0.0.1:5035/api/v1/tickets | head -c 500
          echo ""
          kill $API_PID || true

      - name: Build .NET 10 API Docker Image
        run: docker build --tag sputnik-residence-api:day17 .

      - name: Run Docker Container and Verify Health Endpoint
        run: |
          docker run --detach --name residence-api --publish 8080:8080 sputnik-residence-api:day17

          for i in $(seq 1 30); do
            STATUS=$(curl --silent --output health-response.txt --write-out "%{http_code}" http://localhost:8080/health || true)

            if [ "$STATUS" = "200" ]; then
              break
            fi

            sleep 2
          done

          if [ "$STATUS" != "200" ]; then
            echo "Health endpoint did not return HTTP 200."
            docker logs residence-api
            exit 1
          fi

          echo "=== Health Endpoint Response ==="
          cat health-response.txt

          grep -qx "Healthy" health-response.txt

          echo "Docker container health check passed!"

          docker stop residence-api

      - name: Verify Polyglot Track Workspaces (Angular, Flutter, SQL, Data & AI)
        run: |
          echo "✅ Verifying Track 02 (Angular & Blazor) workspace..."
          test -f frontend/web-angular/package.json
          test -f frontend/web-angular/src/app/services/residence-api.service.ts
          echo "✅ Verifying Track 06 (Flutter & .NET MAUI) workspace..."
          test -f mobile/mobile-flutter/pubspec.yaml
          test -f mobile/mobile-flutter/lib/services/sandbox_api_client.dart
          echo "✅ Verifying Track 03/04/05 (Database, Analytics, AI) workspaces..."
          test -d database && test -d analytics && test -d ai-agents
          echo "✅ All 6 Polyglot WIL Track workspaces verified!"
